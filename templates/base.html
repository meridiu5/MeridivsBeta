<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="Meridivs - Thoughts and essays">
  {{head}}
  <style>
    /* Minimal reset + dark background fallback */
    :root{--bg:#060606;--surface:#0b0b0b;--muted:#9b9b9b;--accent:#ff1b1b;--text:#e9e9e9}
    html,body{height:100%;}
    body{margin:0;font-family: 'Satoshi', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background:var(--bg); color:var(--text);}
    a{color:var(--accent); text-decoration:none}
    .site-wrap{max-width:980px;margin:0 auto;padding:48px 24px}
  </style>
</head>
<body>
  <div class="site-wrap">
    <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:48px">
      <a href="/" style="font-weight:700;font-size:20px;color:var(--text);">Meridivs</a>
      <nav>
        <a href="/about.html" style="color:var(--muted);margin-right:18px">About</a>
      </nav>
    </header>

    {{body}}

    <footer style="margin-top:88px;border-top:1px solid rgba(255,255,255,0.04);padding-top:24px;color:var(--muted);font-size:14px">
      © 2025 Alessandro Muscia — meridivs.com
    </footer>
  </div>
</body>
</html>
